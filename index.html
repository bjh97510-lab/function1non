<body>

  <!-- ═══════════ 학습 화면 ═══════════ -->
  <section id="app-screen" class="screen active" aria-label="학습">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="brand-ic" aria-hidden="true">🐿️</span><span class="brand-text">일차함수 탐험대</span></div>

        <div class="rewards">
          <button type="button" class="reward acorn" id="acorn-badge" aria-label="도토리 보기">
            <span class="r-ic" aria-hidden="true">🌰</span>
            <span class="r-main">
              <span class="r-count"><b id="acorn-count">0</b><small>/10</small></span>
              <span class="r-bar"><i id="acorn-bar"></i></span>
            </span>
          </button>
          <button type="button" class="reward stamp-badge" id="stamp-badge" aria-label="칭찬도장 보기">
            <span class="stamp-mini" aria-hidden="true">참</span>
            <span class="r-count"><b id="stamp-count">0</b><small>개</small></span>
          </button>
        </div>

        <div class="user-area">
          <button type="button" class="icon-btn" id="sound-btn" aria-label="소리 끄기">🔊</button>
          <button type="button" class="btn small ghost" id="reset-btn">🔄 기록 초기화</button>
        </div>
      </div>
      <nav id="stepper" class="stepper" aria-label="학습 단계"></nav>
    </header>

    <main id="content" class="content" tabindex="-1"></main>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
